[project]
name = "retail-data-platform"
version = "0.1.0"
description = "End-to-end retail analytics data platform: GCS, BigQuery, dbt, Airflow"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "faker",
    "fastapi",
    "uvicorn",
    "google-cloud-storage",
    "google-cloud-bigquery",
    "tenacity",
    "requests",
]

[dependency-groups]
dev = ["pytest", "ruff", "httpx", "pre-commit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generator", "ingestion"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
